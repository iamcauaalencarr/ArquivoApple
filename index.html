s://github.com/orcastor/phone_images/blob/master/ios/iPhone%204%20Black.jpg"},{"name":"White","hex":"#EBEBEB","image":"iphone-4/white/produto.jpg","source":"https://github.com/orcastor/phone_images/blob/master/ios/iPhone%204%20White.jpg"}]},{"name":"iPhone 3GS","year":"2009","image":"iphone-3gs/todas-as-cores.jpg","colors":[{"name":"Black","hex":"#000000","image":"iphone-3gs/black/imagem.jpg","source":"https://commons.wikimedia.org/wiki/File:IPhone_3GS_(black)_with_screen_down.jpg"},{"name":"White","hex":"#F1F1F3","image":"iphone-3gs/white/imagem.jpg","source":"https://commons.wikimedia.org/wiki/File:White_-_iPhone_3GS._(5290540382).jpg"}]},{"name":"iPhone 3G","year":"2008","image":"iphone-3g/todas-as-cores.jpg","colors":[{"name":"Black","hex":"#000000","image":"iphone-3g/black/imagem.jpg","source":"https://commons.wikimedia.org/wiki/File:IPhone_3G_rear.jpg"},{"name":"White","hex":"#F1F1F3","image":"iphone-3g/white/imagem.jpg","source":"https://commons.wikimedia.org/wiki/File:IPhone_3G_White.jpg"}]},{"name":"iPhone","year":"2007","image":"iphone/todas-as-cores.jpg","colors":[{"name":"Black","hex":"#B3B9BB 090E13","image":"iphone/black/imagem.png","source":"https://github.com/littlebyteorg/apple-device-images/blob/main/device/iPhone1,1.png"}]}]</script><script>
const catalog=JSON.parse(document.getElementById('catalog').textContent);
const pt={'Black':'Preto','White':'Branco','Silver':'Prateado','Gold':'Dourado','Space Gray':'Cinza-espacial','Rose Gold':'Ouro rosa','Black & Slate':'Preto e ardósia','White & Silver':'Branco e prateado','Blue':'Azul','Green':'Verde','Yellow':'Amarelo','Pink':'Rosa','Purple':'Roxo','Coral':'Coral','Midnight':'Meia-noite','Starlight':'Estelar','Graphite':'Grafite','Jet Black':'Preto brilhante','Pacific Blue':'Azul-pacífico','Sierra Blue':'Azul-sierra','Alpine Green':'Verde-alpino','Midnight Green':'Verde meia-noite','Space Black':'Preto-espacial','Deep Purple':'Roxo-profundo','Black Titanium':'Titânio preto','White Titanium':'Titânio branco','Blue Titanium':'Titânio azul','Natural Titanium':'Titânio natural','Desert Titanium':'Titânio-deserto','Ultramarine':'Ultramarino','Teal':'Verde-acinzentado','Cosmic Orange':'Laranja-cósmico','Deep Blue':'Azul-profundo','Mist Blue':'Azul-névoa','Sage':'Sálvia','Lavender':'Lavanda','Sky Blue':'Azul-céu','Light Gold':'Dourado-claro','Cloud White':'Branco-nuvem','Soft Pink':'Rosa-suave','Star White':'Branco-estelar','Night Sky':'Céu noturno','Burgundy':'Bordô','Glacier':'Glacial'};
const label=s=>pt[s]||s,norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const grid=document.getElementById('grid'),search=document.getElementById('search'),year=document.getElementById('year');
[...new Set(catalog.map(m=>m.year))].sort((a,b)=>b-a).forEach(y=>year.add(new Option(y,y)));
function render(){grid.replaceChildren();let count=0;const q=norm(search.value.trim());for(const m of catalog){if(year.value&&m.year!==year.value)continue;if(q&&!norm(m.name+' '+m.colors.map(c=>c.name+' '+label(c.name)).join(' ')).includes(q))continue;count++;const card=document.createElement('article');card.className='card';card.innerHTML='<div class="top"><span class="year"></span><span class="pill"></span></div><a class="photo" target="_blank" rel="noopener"><img loading="lazy"></a><div class="info"><h2></h2><p class="selection" aria-live="polite"></p><div class="swatches" role="group"></div><div class="bottom"><span>Clique na imagem para ampliar</span><a class="source" target="_blank" rel="noopener">Ver fonte ↗</a></div></div>';card.querySelector('.year').textContent=m.year;card.querySelector('.pill').textContent=m.colors.length+' '+(m.colors.length===1?'cor':'cores');card.querySelector('h2').textContent=m.name;const img=card.querySelector('img'),photo=card.querySelector('.photo'),selection=card.querySelector('.selection'),swatches=card.querySelector('.swatches'),source=card.querySelector('.source');swatches.setAttribute('aria-label','Escolher cor de '+m.name);
function choose(c,b){const path=c?c.image:m.image;img.src=path;img.alt=m.name+' — '+(c?label(c.name):'todas as cores');photo.href=path;selection.textContent=c?label(c.name):'Todas as cores';source.href=c?c.source:'https://support.apple.com/en-us/108044';for(const x of swatches.children)x.setAttribute('aria-pressed',String(x===b))}
const all=document.createElement('button');all.type='button';all.className='all';all.textContent='TODAS';all.title='Mostrar todas as cores';all.addEventListener('click',()=>choose(null,all));swatches.append(all);for(const c of m.colors){const b=document.createElement('button');b.type='button';b.className='swatch';b.style.setProperty('--color',c.hex);b.title=label(c.name);b.setAttribute('aria-label',label(c.name));b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>choose(c,b));swatches.append(b)}choose(null,all);grid.append(card)}document.getElementById('count').textContent=count+' '+(count===1?'modelo':'modelos');if(!count){const p=document.createElement('p');p.className='empty';p.textContent='Nenhum modelo encontrado. Tente outro nome ou ano.';grid.append(p)}}
search.addEventListener('input',render);year.addEventListener('change',render);render();
</script></body></html>
